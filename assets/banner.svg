
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="260"
     viewBox="0 0 1200 260">

  <!-- Background -->
  <rect width="1200" height="260" fill="#4E787B"/>

  <!-- Decorative accent -->
  <rect x="0" y="0" width="8" height="260" fill="#A1C9C4"/>

  <!-- Main title -->
  <text x="65" y="105"
        font-family="Helvetica, Arial, sans-serif"
        font-size="51"
        font-weight="700"
        fill="#D9DECA">
    Airline Passenger Satisfaction
  </text>

  <!-- Subtitle -->
  <text x="67" y="155"
        font-family="Helvetica, Arial, sans-serif"
        font-size="23"
        fill="#A1C9C4">
    Understanding passenger experience through Machine Learning
  </text>

  <!-- Academic information -->
  <text x="67" y="197"
        font-family="Helvetica, Arial, sans-serif"
        font-size="17"
        fill="#D9DECA">
    Integrated Machine Learning Project
  </text>

  <!-- Airplane -->
  <text x="1050" y="193"
        font-family="Arial, sans-serif"
        font-size="90"
        fill="#D9DECA">✈</text>

  <!-- Bottom colour strip -->
  <rect x="0" y="244" width="240" height="16" fill="#D9DECA"/>
  <rect x="240" y="244" width="240" height="16" fill="#A1C9C4"/>
  <rect x="480" y="244" width="240" height="16" fill="#4E787B"/>
  <rect x="720" y="244" width="240" height="16" fill="#42443B"/>
  <rect x="960" y="244" width="240" height="16" fill="#231F25"/>

</svg>
